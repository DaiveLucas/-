  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <script>
    lucide.createIcons();

    $(function() {
      // 更新收藏数量显示
      function updateCount() {
        const count = $('#favorites-grid .favorite-card').length;
        $('#favorite-count').text(count);
        if (count === 0) {
          $('#favorites-grid').addClass('hidden');
          $('#empty-state').removeClass('hidden').addClass('flex');
          $('#btn-download-all').addClass('hidden');
        }
      }

      // 移除收藏按钮点击
      $('#favorites-grid').on('click', '.btn-remove', function(e) {
        e.stopPropagation();
        const card = $(this).closest('.favorite-card');
        const id = card.data('id');
        
        // 移除动画
        card.css({
          'transform': 'scale(0.9)',
          'opacity': '0'
        });
        setTimeout(function() {
          card.remove();
          updateCount();
          lucide.createIcons();
        }, 200);
        
        console.log('移除收藏:', id);
      });

      // 下载按钮点击
      $('#favorites-grid').on('click', '.btn-download', function(e) {
        e.stopPropagation();
        const card = $(this).closest('.favorite-card');
        const imgSrc = card.find('img').attr('src');
        const imgAlt = card.find('img').attr('alt');
        console.log('下载壁纸:', imgAlt, imgSrc);
        // 实际下载逻辑：创建临时 a 标签触发下载
        const link = document.createElement('a');
        link.href = imgSrc;
        link.download = imgAlt || 'wallpaper.jpg';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      // 卡片点击跳转详情页
      $('#favorites-grid').on('click', '.favorite-card', function() {
        const id = $(this).data('id');
        window.location.href = 'wallpaper.html?id=' + id;
      });

      // 全部下载按钮点击
      $('#btn-download-all').on('click', function() {
        const cards = $('#favorites-grid .favorite-card');
        console.log('批量下载', cards.length, '张壁纸');
        // 批量下载逻辑：
        // 1. 遍历所有收藏卡片，获取图片 URL
        // 2. 逐个触发下载或打包为 zip 下载
        cards.each(function(index) {
          const imgSrc = $(this).find('img').attr('src');
          const imgAlt = $(this).find('img').attr('alt');
          setTimeout(function() {
            const link = document.createElement('a');
            link.href = imgSrc;
            link.download = (imgAlt || 'wallpaper-' + index) + '.jpg';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }, index * 300); // 间隔 300ms 避免浏览器拦截
        });
      });
    });
  </script>
</body>

</html>
