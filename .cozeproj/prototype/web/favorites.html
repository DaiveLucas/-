  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <script>
    lucide.createIcons();

    $(function() {
      // 移除收藏按钮点击事件
      // 完整交互行为：
      // 1. 从收藏列表中移除该壁纸卡片
      // 2. 更新 localStorage 中的收藏数据
      // 3. 如果移除后列表为空，显示空态提示
      // 4. 同步更新首页该壁纸的收藏状态（如果首页已打开）
      $('#favorites-grid').on('click', '.btn-remove', function() {
        const cardId = $(this).data('id');
        const $card = $(this).closest('.favorite-card');
        
        // 添加移除动画
        $card.addClass('opacity-0 scale-95');
        
        setTimeout(function() {
          $card.remove();
          
          // 检查是否还有收藏项
          if ($('#favorites-grid .favorite-card').length === 0) {
            $('#favorites-grid').addClass('hidden');
            $('#empty-state').removeClass('hidden');
            lucide.createIcons();
          }
        }, 300);
        
        console.log('移除收藏:', cardId);
      });

      // 下载按钮点击事件
      // 完整交互行为：
      // 1. 获取该壁纸的高清原图 URL
      // 2. 触发浏览器下载（通过创建隐藏的 <a download> 标签）
      // 3. 更新该壁纸的下载次数统计
      $('#favorites-grid').on('click', '.btn-download', function() {
        const cardId = $(this).data('id');
        const imgSrc = $(this).closest('.favorite-card').find('img').attr('src');
        
        // 创建下载链接
        const link = document.createElement('a');
        link.href = imgSrc;
        link.download = 'wallpaper-' + cardId + '.jpg';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log('下载壁纸:', cardId, imgSrc);
      });

      // 壁纸卡片点击事件 - 跳转到详情页
      // 完整交互行为：
      // 1. 获取壁纸 ID
      // 2. 跳转到详情页，传递壁纸 ID 参数
      $('#favorites-grid').on('click', '.favorite-card', function(e) {
        // 如果点击的是按钮，不触发卡片点击
        if ($(e.target).closest('button').length) return;
        
        const cardId = $(this).data('id');
        window.location.href = 'wallpaper.html?id=' + cardId;
      });
    });
  </script>
