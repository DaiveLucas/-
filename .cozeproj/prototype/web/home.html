  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <script>
    lucide.createIcons();

    $(function() {
      // 分类切换功能
      // 1. 点击分类标签时，更新标签样式（选中态）
      // 2. 根据选中的分类，过滤壁纸卡片显示/隐藏
      // 3. "全部"分类显示所有壁纸
      $('#category-tabs').on('click', '.category-tab', function() {
        var category = $(this).data('category');
        
        // 更新标签样式
        $('.category-tab').removeClass('bg-primary text-on-primary').addClass('bg-surface-container text-on-surface-variant');
        $(this).removeClass('bg-surface-container text-on-surface-variant').addClass('bg-primary text-on-primary');
        
        // 过滤壁纸卡片
        if (category === 'all') {
          $('.wallpaper-card').show();
        } else {
          $('.wallpaper-card').each(function() {
            if ($(this).data('category') === category) {
              $(this).show();
            } else {
              $(this).hide();
            }
          });
        }
      });

      // 壁纸卡片点击 - 跳转到详情页
      // 传递壁纸 ID 作为 URL 参数
      $('#wallpaper-grid').on('click', '.wallpaper-card', function(e) {
        // 如果点击的是收藏或下载按钮，不触发跳转
        if ($(e.target).closest('.btn-fav, .btn-dl').length) return;
        
        var id = $(this).data('id');
        window.location.href = 'wallpaper.html?id=' + id;
      });

      // 收藏按钮点击
      // 后续应实现：
      // 1. 切换收藏状态（心形图标填充/空心）
      // 2. 将壁纸 ID 存入 localStorage 收藏列表
      // 3. 已收藏的壁纸显示填充心形
      $('#wallpaper-grid').on('click', '.btn-fav', function(e) {
        e.stopPropagation();
        var id = $(this).data('id');
        var $icon = $(this).find('i');
        
        // 切换收藏状态
        if ($icon.hasClass('lucide-heart')) {
          $icon.attr('data-lucide', 'heart').addClass('fill-current');
          $(this).addClass('bg-error/40');
          console.log('添加收藏: 壁纸 ID', id);
        } else {
          $icon.attr('data-lucide', 'heart').removeClass('fill-current');
          $(this).removeClass('bg-error/40');
          console.log('取消收藏: 壁纸 ID', id);
        }
        lucide.createIcons();
      });

      // 下载按钮点击
      // 后续应实现：
      // 1. 获取壁纸原图 URL
      // 2. 创建隐藏的 <a> 标签触发下载
      // 3. 或调用后端下载接口
      $('#wallpaper-grid').on('click', '.btn-dl', function(e) {
        e.stopPropagation();
        var id = $(this).data('id');
        console.log('下载壁纸: 壁纸 ID', id);
        // 示例：触发下载
        // var imgUrl = $(this).closest('.wallpaper-card').find('img').attr('src');
        // var link = document.createElement('a');
        // link.href = imgUrl;
        // link.download = 'wallpaper-' + id + '.jpg';
        // link.click();
      });
    });
  </script>
