  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <!-- 交互逻辑 -->
  <script>
    $(function() {
      // 初始化 Lucide 图标
      lucide.createIcons();

      // 分类标签切换
      $('#category-tabs').on('click', '.category-tab', function() {
        // 移除所有激活态
        $('.category-tab').removeClass('active bg-primary text-on-primary')
          .addClass('bg-surface-container text-on-surface-variant');
        // 设置当前激活态
        $(this).addClass('active bg-primary text-on-primary')
          .removeClass('bg-surface-container text-on-surface-variant');
        
        const category = $(this).data('category');
        console.log('切换分类:', category);
        // 后续应实现：根据分类筛选壁纸列表，重新渲染网格
      });

      // 壁纸卡片点击 - 跳转详情页
      $('#wallpaper-grid').on('click', '.wallpaper-card', function(e) {
        // 如果点击的是收藏或下载按钮，不跳转
        if ($(e.target).closest('.btn-favorite, .btn-download').length) return;
        
        const id = $(this).data('id');
        window.location.href = `wallpaper.html?id=${id}`;
      });

      // 收藏按钮点击
      $('#wallpaper-grid').on('click', '.btn-favorite', function(e) {
        e.stopPropagation();
        const id = $(this).data('id');
        const $icon = $(this).find('i');
        
        // 切换收藏状态
        if ($icon.hasClass('text-white')) {
          $icon.removeClass('text-white').addClass('text-error fill-error');
          console.log('添加收藏:', id);
          // 后续应实现：将壁纸ID存入 localStorage 收藏列表
        } else {
          $icon.addClass('text-white').removeClass('text-error fill-error');
          console.log('取消收藏:', id);
          // 后续应实现：从 localStorage 收藏列表移除
        }
      });

      // 下载按钮点击
      $('#wallpaper-grid').on('click', '.btn-download', function(e) {
        e.stopPropagation();
        const id = $(this).data('id');
        console.log('下载壁纸:', id);
        // 后续应实现：获取图片URL，触发浏览器下载
      });

      // AI 搜索提交
      $('#ai-search-submit').on('click', function() {
        const keyword = $('#ai-search-input').val().trim();
        if (keyword) {
          console.log('搜索壁纸:', keyword);
          // 后续应实现：调用搜索接口或筛选壁纸列表
        }
      });

      // AI 搜索回车提交
      $('#ai-search-input').on('keypress', function(e) {
        if (e.which === 13) {
          $('#ai-search-submit').click();
        }
      });

      // 加载更多按钮
      $('#load-more-btn').on('click', function() {
        console.log('加载更多壁纸');
        // 后续应实现：请求下一页数据，追加到壁纸网格
        // 示例行为：
        // 1. 显示加载状态（按钮文字改为"加载中..."）
        // 2. 发起 API 请求获取下一页数据
        // 3. 将新数据渲染为 HTML 节点追加到 #wallpaper-grid
        // 4. 恢复按钮状态
      });

      // 主题切换按钮
      $('#theme-toggle').on('click', function() {
        console.log('切换深色/浅色主题');
        // 后续应实现：切换深色模式，更新 Tailwind dark: 类
      });

      // 搜索按钮（顶部导航）

        $('#ai-search-input').focus();
      });
    });
  </script>
