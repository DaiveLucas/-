<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <!-- 字体 -->

  <style type="text/tailwindcss">
    @theme {

      --color-primary:              #1A1A1A;
      --color-primary-container:    #2A2A2A;
      --color-on-primary:           #FFFFFF;
      /* === 背景 / 表面 === */
      --color-background:                 #FAFAF7;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F5F5F0;
      --color-surface-container-high:     #EBEBE5;
      --color-surface-container-highest:  #E0E0D8;
      /* === 文字 === */
      --color-on-surface:           #151515;
      --color-on-surface-variant:   #77736B;
      /* === 功能色 === */

      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #E6E2DA;
      --color-outline-variant:  #D4D0C8;
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;

      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);

      /* === 字体 === */

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <header id="navbar" class="sticky top-0 z-40 bg-background/80 backdrop-blur-md border-b border-outline/20 transition-all duration-300">

      <!-- Logo -->
      <a href="home.html" class="flex items-center gap-2.5">

      <!-- 右侧操作 -->

        </button>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-surface-container transition-colors" title="切换主题">

    </div>
  </header>

  <!-- @main-content:start -->

    </div>

    <!-- 主内容区：大图 + 信息面板 -->

            class="w-full h-auto rounded-2xl shadow-float"

        </div>
      </div>

      <!-- 右侧：信息面板 -->
      <div class="w-full lg:w-80 shrink-0 space-y-6">

        <!-- 分类标签 -->

          <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-primary/10 text-primary">
            自然风景

        </div>

        <!-- 标签列表 -->
        <div>
          <div class="text-xs font-medium text-on-surface-variant uppercase tracking-wide mb-2">标签</div>
          <div class="flex flex-wrap gap-2">
            <!-- 标签1 -->
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-surface-container text-on-surface-variant">星空</span>
            <!-- 标签2 -->
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-surface-container text-on-surface-variant">雪山</span>
            <!-- 标签3 -->
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-surface-container text-on-surface-variant">夜景</span>
            <!-- 标签4 -->
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-surface-container text-on-surface-variant">银河</span>
            <!-- 标签5 -->
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-surface-container text-on-surface-variant">治愈系</span>
          </div>
        </div>

        <!-- 分辨率信息 -->
        <div>
          <div class="text-xs font-medium text-on-surface-variant uppercase tracking-wide mb-2">分辨率</div>
          <div class="flex items-center gap-2 text-sm text-on-surface">
            <i data-lucide="maximize" class="w-4 h-4 text-on-surface-variant"></i>
            <span id="wallpaper-resolution">4928 × 3264</span>
          </div>
        </div>

        <!-- 来源 -->
        <div>
          <div class="text-xs font-medium text-on-surface-variant uppercase tracking-wide mb-2">来源</div>
          <div class="flex items-center gap-2 text-sm text-on-surface-variant">
            <i data-lucide="external-link" class="w-4 h-4"></i>
            <span>Unsplash</span>
          </div>
        </div>

        <!-- 分隔线 -->
        <div class="border-t border-outline/30"></div>

        <!-- 操作按钮区 -->
        <div class="space-y-3">
          <!-- 收藏按钮 -->
          <button id="btn-favorite" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-medium border border-outline/30 hover:border-outline/60 hover:bg-surface-container transition-all">
            <i data-lucide="heart" class="w-5 h-5"></i>
            <span id="favorite-text">添加收藏</span>
          </button>
          
          <!-- 下载原图按钮 -->
          <button id="btn-download" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-medium bg-primary text-on-primary hover:opacity-90 active:scale-[0.98] transition-all shadow-card">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>下载原图</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="my-12 border-t border-outline/20"></div>

    <!-- 相似推荐 -->
    <section>
      <h2 class="text-lg font-semibold text-on-surface mb-6">相似壁纸</h2>
      <div id="similar-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        
        <!-- 相似壁纸1 -->

        </a>

        <!-- 相似壁纸2 -->

          <div class="relative aspect-[3/2] overflow-hidden rounded-lg bg-surface-container">
            <img 
              src="https://images.unsplash.com/photo-1464809375023-be5f84c29678?w=400&q=80" 
              alt="雪山日出" 
              data-category="自然风景"

            />
          </div>
        </a>

        <!-- 相似壁纸3 -->
        <a href="wallpaper.html?id=4" class="group block">
          <div class="relative aspect-[3/2] overflow-hidden rounded-lg bg-surface-container">
            <img 
              src="https://images.unsplash.com/photo-1509310020374-e3d2f7a1f6c6?w=400&q=80"

        </a>

        <!-- 相似壁纸4 -->

            <img

          </div>
        </a>

        <!-- 相似壁纸5 -->
        <a href="wallpaper.html?id=6" class="group block">
          <div class="relative aspect-[3/2] overflow-hidden rounded-lg bg-surface-container">
            <img 
              src="https://images.unsplash.com/photo-1464823065480-47f6e523c549?w=400&q=80"

    <!-- 底部留白 -->
    <div class="h-12"></div>
  </main>
  <!-- @main-content:end -->

  <script>
    lucide.createIcons();

    $(function() {
      // 收藏状态（模拟）
      let isFavorited = false;

      // 返回按钮 - 点击返回首页
      $('#btn-back').on('click', function() {
        window.location.href = 'home.html';
      });

      // 收藏按钮 - 切换收藏状态
      $('#btn-favorite').on('click', function() {
        isFavorited = !isFavorited;
        const $btn = $(this);
        const $text = $('#favorite-text');
        const $icon = $btn.find('i');
        
        if (isFavorited) {
          $btn.addClass('border-error/30 bg-error/5');
          $btn.removeClass('border-outline/30');
          $icon.attr('data-lucide', 'heart').addClass('text-error fill-error');
          $text.text('已收藏').addClass('text-error');
          lucide.createIcons();
        } else {
          $btn.removeClass('border-error/30 bg-error/5');
          $btn.addClass('border-outline/30');
          $icon.attr('data-lucide', 'heart').removeClass('text-error fill-error');
          $text.text('添加收藏').removeClass('text-error');
          lucide.createIcons();
        }
      });

      // 下载按钮 - 触发图片下载
      $('#btn-download').on('click', function() {
        const imgUrl = $('#wallpaper-image').attr('src');
        const link = document.createElement('a');
        link.href = imgUrl;
        link.download = 'wallpaper.jpg';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      // 相似壁纸点击 - 跳转到详情页（已通过 href 实现）
    });
  </script>
</body>

</html>
